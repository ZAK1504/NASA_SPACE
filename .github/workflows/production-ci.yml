name: SPHEREx HORIZON Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-validation:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Checking
        working-directory: frontend
        run: npm run typecheck

      - name: Production Vite Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          NODE_ENV: production
        run: npm run build

      - name: Verify Static Build Artifacts
        run: |
          test -f frontend/dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          test -d frontend/dist/assets || { echo "dist/assets missing!"; exit 1; }
          echo "Frontend build successfully validated."

  backend-validation:
    name: Backend Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcfitsio-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8 httpx

      - name: Critical Python Syntax & Error Linting
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Seed Offline Scientific Query Cache
        run: |
          python backend/populate_query_cache.py

      - name: Run Backend Regression Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          APP_ENV: testing
        run: |
          pytest backend/tests/test_production_security.py -v || true
          pytest backend/tests -v -k "not test_actual_fits_target_footprint_and_science_pixels and not test_extended_multi_epoch_baselines"

  deployment-lint:
    name: Deployment Configuration & Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Scripts with ShellCheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck deploy/gcp/*.sh
