<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="2" y1="26" x2="30" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF7B3D" />
      <stop offset="60%" stopColor="#F4A272" />
      <stop offset="100%" stopColor="#FFE0CC" />
    </linearGradient>
    <radialGradient id="sphere-core" cx="16" cy="16" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F4A272" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#1B1724" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#0B0910" stopOpacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Dark Space Base -->
  <rect width="32" height="32" rx="7" fill="#08080C" />

  <!-- Celestial Core Glow -->
  <circle cx="16" cy="16" r="9" fill="url(#sphere-core)" />

  <!-- Celestial Sphere Ring -->
  <circle cx="16" cy="16" r="8" stroke="#F3EFE8" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Latitude Guide Arc -->
  <path d="M8.5 16C8.5 19.5 11.8 22.5 16 22.5C20.2 22.5 23.5 19.5 23.5 16" stroke="#F3EFE8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="1.5 2" />

  <!-- Tilted Elliptical Orbital Path -->
  <ellipse cx="16" cy="16" rx="13.2" ry="5.2" transform="rotate(-32 16 16)" stroke="url(#orbit-grad)" stroke-width="1.75" stroke-linecap="round" />

  <!-- Radiant Spectral Discovery Spark -->
  <circle cx="25.5" cy="10" r="3" fill="#F4A272" fill-opacity="0.35" />
  <path d="M25.5 6.8L26.4 9.1L28.7 10L26.4 10.9L25.5 13.2L24.6 10.9L22.3 10L24.6 9.1Z" fill="#FFFFFF" />
  <circle cx="25.5" cy="10" r="1.1" fill="#FFFFFF" />
</svg>
